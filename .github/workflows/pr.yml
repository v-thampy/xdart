name: PR
on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev,fitting,rsm,notebook]"
      - run: pytest tests/core -x -vv --tb=short -m "not slow" --timeout=300

  numerical-portability:
    name: numerical-portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, and xrayutilities==1.7.12 ships no arm64
        # macOS wheel, so pip builds its sdist and fails on the runner's
        # Apple clang ("openmp not found").  The Intel image installs the
        # published x86_64 wheel; revisit when the xrayutilities pin moves.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev,rsm]"
      # Real native pyFAI/XU execution on each OS. This does not substitute for
      # the separate GUI and file-publication tests or native release testing.
      - run: >-
          python -m pytest
          tests/core/test_single.py
          tests/core/test_per_frame_conditioning.py
          tests/core/test_xu_runtime.py
          tests/core/test_xu_stitch.py
          tests/core/test_xu_stitch_calibration.py
          tests/core/test_rsm_geometry_asset.py
          tests/core/test_rsm_equivalence.py
          tests/core/test_rsm_coordinate_frame.py
          tests/core/test_rsm_corrections.py
          -x -vv --tb=short -m "not slow" --timeout=120

  windows-pixi-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.72.1
          manifest-path: pyproject.toml
          locked: true
      # Require imports so missing native dependencies cannot turn into skips.
      - run: >-
          pixi run --locked python -c
          "import hdf5plugin, xrayutilities, numexpr; print('NumExpr', numexpr.__version__, 'VML', numexpr.use_vml)"
      - run: >-
          pixi run --locked python -m pytest
          tests/core/test_single.py::test_pyfai_q_grid_matches_detector_geometry
          tests/core/test_single.py::test_readonly_mask_detaches_for_pyfai_without_changing_exclusions
          tests/core/test_nexus.py::TestResolveStackCompression::test_lz4_round_trips_when_natively_supported
          tests/core/test_circle_angles.py::test_q_identity_through_pixel_q
          -q -ra --timeout=120
        env:
          XDART_SESSION_FILE: ${{ runner.temp }}/xdart-pixi-session.json
          XDART_SETTINGS_FILE: ${{ runner.temp }}/xdart-pixi-settings.json
      - name: Run and reopen mixed-case processed scans
        run: >-
          pixi run --locked python scripts/ci_pytest.py
          tests/xdart/scattering/test_windows_browse_paths.py
          tests/xdart/scattering/test_authoring_launch.py
          tests/xdart/scattering/test_append_per_frame_saturation.py
          tests/xdart/scattering/test_append_mode_dialog.py
          tests/xdart/scattering/test_gi_motorless_source.py
          tests/core/test_h23_output_transaction.py::test_stream_seed_preserves_binary_bytes
          tests/xdart/scattering/test_p1b_output_graph.py::test_standard_then_grazing_run_can_exceed_memory_target[synthetic]
          tests/core/test_frame_preview.py::test_reader_decodes_persisted_windows_source_base_for_runtime
          tests/core/test_frame_preview.py::test_mixed_case_project_preview_and_full_raw_use_stored_root
          tests/core/test_n1_source_paths.py::test_relative_source_path_uses_windows_case_rules
          tests/core/test_n1_source_paths.py::test_writer_source_paths_reopen_raw_in_notebooks_and_viewer
          tests/core/test_n1_source_paths.py::test_append_project_root_uses_native_case_rules
          -q -ra --timeout=120
        env:
          XDART_SESSION_FILE: ${{ runner.temp }}/xdart-pixi-browse-session.json
          XDART_SETTINGS_FILE: ${{ runner.temp }}/xdart-pixi-browse-settings.ini

  architecture-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/core/test_architecture_guards.py -q --timeout=120

  xdart-offscreen:
    name: xdart-offscreen (${{ matrix.group }})
    strategy:
      fail-fast: false
      # The harness retains Qt objects to avoid unsafe DeferredDelete teardown.
      # Bound that graph per process: application-wide theme changes otherwise
      # repolish thousands of widgets left by unrelated tests.
      matrix:
        include:
          - group: execution-context
            tests: tests/xdart/scattering/test_e[123]*.py
          - group: directory-display
            tests: tests/xdart/scattering/test_e[46]*.py
          - group: viewers-analysis
            tests: tests/xdart/scattering/test_p*.py
          - group: scattering-other
            tests: tests/xdart/scattering --ignore-glob=tests/xdart/scattering/test_e[12346]*.py --ignore-glob=tests/xdart/scattering/test_p*.py
          - group: application
            tests: tests/xdart --ignore=tests/xdart/scattering
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: pip install -e ".[gui,dev,fitting,rsm,notebook]"
      - env:
          QT_QPA_PLATFORM: offscreen
          XDART_SESSION_FILE: ${{ runner.temp }}/xdart-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}-session.json
          XDART_SETTINGS_FILE: ${{ runner.temp }}/xdart-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}-settings.ini
        # scripts/ci_pytest.py hard-exits with pytest's own verdict as soon as
        # the run completes: the offscreen PySide6/pyqtgraph object graph
        # deterministically SIGSEGVs (exit 139) during *interpreter shutdown* —
        # after "N passed" and a clean JUnit — and skipping teardown is the
        # standard Qt-in-CI practice (pyqtgraph ships pg.exit() for exactly
        # this).  A mid-run crash still exits 139 here and still fails; retry
        # ONLY that case (the historical PlotItem-construction GL flake).  A
        # real test failure fails fast: any other non-zero exit, or failures
        # recorded in the JUnit even when a segfault masks pytest's exit 1.
        # NB `|| code=$?`: GitHub runs bash with -e, so the previous bare
        # `pytest; code=$?` aborted the step on the first non-zero exit and
        # this loop's retry/guard logic never executed at all.
        run: |
          for attempt in 1 2 3; do
            code=0
            python scripts/ci_pytest.py ${{ matrix.tests }} -x -vv --tb=short --timeout=600 --junitxml="xdart-attempt-$attempt.xml" || code=$?
            [ "$code" -eq 0 ] && exit 0
            if grep -qE '(failures|errors)="[1-9][0-9]*"' "xdart-attempt-$attempt.xml" 2>/dev/null; then
              echo "::error::pytest tests/xdart reported real failures (not a segfault flake)"
              exit 1
            fi
            if [ "$code" -ne 139 ]; then exit "$code"; fi
            echo "::warning::pytest tests/xdart segfaulted mid-run (139), no reported failures, on attempt $attempt; retrying"
          done
          exit 139

  # Release-readiness preflight: version pins, the audited pyFAI window, and the
  # schema/byte-compat gate must stay green on every PR.  No --strict-tree, so an
  # uncommitted tree only warns (a clean CI checkout passes the tree check anyway).
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      # base+dev suffices: `import xdart` resolves without the gui extra, and the
      # schema check's two test files need only io (h5py, pyFAI is a base dep) + pytest.
      - run: pip install -e ".[dev]"
      - run: python scripts/release.py check
